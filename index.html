<!DOCTYPE html>
<html lang="nl">
<head>
<script src="errors.js" defer></script>
<script src="auth.js" defer></script>
<script src="magister.js" defer></script>
<script src="app.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315f8d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SMIM">

<link rel="manifest" href="manifest.webmanifest">

<title>SMIM — Sekond’s Modified Information Magister</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    color:#222;
    background:#e7e9ec;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:1px solid #9ba4ad;
    background:linear-gradient(#fff,#e5e7e9);
    padding:5px 9px;
    border-radius:2px;
    color:#222;
}

button:hover{
    background:#dce8f4;
}

button:active{
    background:#c9d8e7;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   VARIABLES
   ========================================================= */

:root{
    --blue:#315f8d;
    --blue-dark:#254b70;
    --blue-light:#dce8f4;

    --bg:#e7e9ec;
    --panel:#f7f7f7;
    --white:#fff;

    --border:#aeb6bf;
    --border-light:#cdd2d7;

    --text:#222;
    --muted:#69747d;

    --green:#287844;
    --red:#a43737;
    --yellow:#8a6500;

    --sidebar-width:190px;
    --topbar-height:48px;
    --bottom-nav-height:58px;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    height:var(--topbar-height);
    background:linear-gradient(#3e719f,#2c547b);
    color:#fff;

    display:flex;
    align-items:center;

    padding:
        env(safe-area-inset-top)
        10px
        0
        10px;

    border-bottom:1px solid #203e5a;
    box-shadow:0 1px 3px #777;

    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    width:215px;
    flex-shrink:0;

    font-size:19px;
    font-weight:bold;
}

.logo small{
    display:block;
    font-size:10px;
    font-weight:normal;
    opacity:.85;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:5px;
    flex:1;
}

.top-actions input{
    height:28px;
    width:300px;

    border:1px solid #1e405e;
    padding:4px 8px;
}

.profile-button{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:7px;

    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
}

/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.layout{
    display:flex;
    min-height:calc(100vh - var(--topbar-height));
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    width:var(--sidebar-width);
    flex-shrink:0;

    background:#d8dce0;
    border-right:1px solid #9fa6ad;

    padding:7px 5px;

    overflow-y:auto;

    position:sticky;
    top:var(--topbar-height);
    height:calc(100vh - var(--topbar-height));
}

.side-section{
    font-size:10px;
    color:#59636c;
    font-weight:bold;
    text-transform:uppercase;

    padding:8px 7px 4px;
}

.nav-btn{
    width:100%;
    text-align:left;

    border:1px solid transparent;
    background:transparent;

    padding:7px 9px;
    margin-bottom:1px;
}

.nav-btn:hover{
    background:#edf1f4;
    border-color:#b7bec5;
}

.nav-btn.active{
    background:#fff;
    border-color:#9fa8b1;

    box-shadow:inset 3px 0 var(--blue);

    font-weight:bold;
}

/* =========================================================
   MAIN CONTENT
   ========================================================= */

.main{
    flex:1;
    min-width:0;

    padding:10px;

    overflow-x:hidden;
}

.page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:8px;
}

.page-title{
    font-size:20px;
    color:#263b4d;
    font-weight:bold;
}

.page-subtitle{
    color:#68747e;
    font-size:11px;
    margin-top:2px;
}

.toolbar{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
}

/* =========================================================
   PANELS
   ========================================================= */

.columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;

    margin-bottom:8px;
}

.columns.three{
    grid-template-columns:repeat(3,1fr);
}

.panel{
    background:var(--panel);

    border:1px solid var(--border);

    box-shadow:0 1px 2px rgba(0,0,0,.08);

    margin-bottom:8px;
}

.panel-title{
    min-height:32px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:5px 8px;

    background:linear-gradient(#fafafa,#e2e5e8);

    border-bottom:1px solid var(--border-light);

    font-weight:bold;
    color:#30485d;
}

.panel-actions{
    display:flex;
    gap:3px;
}

.panel-body{
    padding:7px;
}

.panel.collapsed .panel-body{
    display:none;
}

/* =========================================================
   TABLES
   ========================================================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    min-width:500px;

    border-collapse:collapse;
    background:#fff;
}

th{
    text-align:left;

    background:#e1e5e8;

    border:1px solid #c0c6cb;

    padding:5px 6px;

    white-space:nowrap;
}

td{
    border:1px solid #d0d4d8;

    padding:5px 6px;

    vertical-align:middle;
}

tbody tr:hover{
    background:#e8f0f8;
}

.clickable{
    cursor:pointer;
}

/* =========================================================
   STATS
   ========================================================= */

.stat{
    border:1px solid var(--border);
    background:#fff;
    padding:8px;
}

.stat-title{
    font-size:11px;
    color:#68747d;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
    color:var(--blue);

    margin-top:2px;
}

.stat-detail{
    font-size:10px;
    color:#747b80;
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
    display:inline-block;

    padding:2px 6px;

    border:1px solid #adb5bc;
    background:#e8eaec;

    font-size:11px;

    border-radius:2px;

    white-space:nowrap;
}

.badge.green{
    background:#dcefe1;
    border-color:#9bc0a3;
    color:#236337;
}

.badge.red{
    background:#f2dede;
    border-color:#d1a3a3;
    color:#8d2929;
}

.badge.yellow{
    background:#f5edcf;
    border-color:#d7c78d;
    color:#745a00;
}

.badge.blue{
    background:#dce9f6;
    border-color:#a9bfd4;
    color:#28557e;
}

/* =========================================================
   AVATARS
   ========================================================= */

.pfp{
    width:30px;
    height:30px;

    border-radius:3px;

    background:linear-gradient(#6d8fad,#3d5e7c);

    color:#fff;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    font-size:11px;

    flex-shrink:0;

    border:1px solid #304d67;
}

.pfp.big{
    width:72px;
    height:72px;

    font-size:23px;
}

.user-cell{
    display:flex;
    align-items:center;
    gap:7px;
}

.user-name{
    font-weight:bold;
}

.user-sub{
    font-size:10px;
    color:#6d757c;
}

/* =========================================================
   DETAIL GRID
   ========================================================= */

.detail-grid{
    display:grid;
    grid-template-columns:150px 1fr;

    border:1px solid #ccd1d5;
    background:#fff;
}

.detail-grid div{
    padding:6px;

    border-bottom:1px solid #d7dade;
}

.detail-grid .label{
    background:#e8ebed;

    font-weight:bold;
    color:#53606b;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-bg{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.35);

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal{
    width:min(760px,100%);
    max-height:90vh;

    overflow:auto;

    background:#f4f4f4;

    border:1px solid #737b82;

    box-shadow:0 4px 18px rgba(0,0,0,.35);
}

.modal-head{
    background:linear-gradient(#fafafa,#dfe2e5);

    border-bottom:1px solid #afb6bc;

    padding:7px 9px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    font-weight:bold;
    color:#30485d;

    position:sticky;
    top:0;
    z-index:2;
}

.modal-body{
    padding:10px;
}

.modal-foot{
    border-top:1px solid #c2c6ca;

    padding:7px;

    text-align:right;

    background:#e9ebed;

    position:sticky;
    bottom:0;
}

/* =========================================================
   MOBILE BOTTOM NAV
   ========================================================= */

.mobile-nav{
    display:none;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-results{
    margin-top:8px;
}

.result{
    background:#fff;

    border:1px solid #c8cdd1;

    padding:7px;

    margin-bottom:4px;

    cursor:pointer;
}

.result:hover{
    background:#edf4fa;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.setting{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    border-bottom:1px solid #ddd;

    padding:9px 3px;
}

.setting:last-child{
    border-bottom:0;
}

.setting-name{
    font-weight:bold;
}

.setting-desc{
    font-size:11px;
    color:#70777c;

    margin-top:2px;
}

/* =========================================================
   ULTRAWIDE
   ========================================================= */

@media(min-width:1600px){

    .main{
        max-width:1800px;
        margin:auto;
        width:100%;
    }

    .columns.three{
        grid-template-columns:repeat(6,1fr);
    }

}

/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:900px){

    .sidebar{
        width:65px;
    }

    .side-section{
        display:none;
    }

    .nav-btn{
        font-size:0;
        text-align:center;
        padding:10px 2px;
    }

    .nav-btn::first-letter{
        font-size:17px;
    }

    .logo{
        width:110px;
    }

    .logo small{
        display:none;
    }

    .top-actions input{
        width:220px;
    }

    .columns.three{
        grid-template-columns:repeat(2,1fr);
    }
}

/* =========================================================
   PHONE
   ========================================================= */

@media(max-width:650px){

    :root{
        --topbar-height:54px;
    }

    body{
        padding-bottom:calc(
            var(--bottom-nav-height)
            + env(safe-area-inset-bottom)
        );
    }

    .topbar{
        height:var(--topbar-height);

        padding-left:
            max(7px,env(safe-area-inset-left));

        padding-right:
            max(7px,env(safe-area-inset-right));
    }

    .logo{
        width:62px;
        font-size:18px;
    }

    .top-actions{
        min-width:0;
    }

    .top-actions input{
        width:100%;
        min-width:0;
    }

    .top-actions button{
        display:none;
    }

    .profile-button{
        margin-left:4px;
        padding:3px;
    }

    .profile-button span:last-child{
        display:none;
    }

    .sidebar{
        display:none;
    }

    .layout{
        min-height:calc(100vh - var(--topbar-height));
    }

    .main{
        padding:7px;

        padding-left:
            max(7px,env(safe-area-inset-left));

        padding-right:
            max(7px,env(safe-area-inset-right));
    }

    .page-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-title{
        font-size:18px;
    }

    .toolbar{
        width:100%;
    }

    .toolbar button,
    .toolbar select{
        flex:1;
    }

    .columns,
    .columns.three{
        grid-template-columns:1fr;
    }

    .stat{
        min-height:72px;
    }

    .panel-title{
        min-height:36px;
    }

    .panel-body{
        padding:5px;
    }

    .detail-grid{
        grid-template-columns:110px 1fr;
    }

    .modal-bg{
        padding:8px;
        align-items:flex-end;
    }

    .modal{
        max-height:92vh;
        width:100%;
    }

    .mobile-nav{
        position:fixed;

        display:grid;
        grid-template-columns:repeat(5,1fr);

        left:0;
        right:0;
        bottom:0;

        height:var(--bottom-nav-height);

        padding-bottom:env(safe-area-inset-bottom);

        background:#e0e3e6;

        border-top:1px solid #969da4;

        z-index:60;

        box-shadow:0 -2px 5px rgba(0,0,0,.12);
    }

    .mobile-nav button{
        border:0;
        border-radius:0;

        background:transparent;

        padding:4px 2px;

        font-size:10px;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;

        gap:2px;
    }

    .mobile-nav button.active{
        background:#fff;
        box-shadow:inset 0 3px var(--blue);
        font-weight:bold;
    }

    .mobile-icon{
        font-size:17px;
    }

    table{
        min-width:620px;
    }

}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:380px){

    .logo{
        width:50px;
        font-size:16px;
    }

    .pfp{
        width:27px;
        height:27px;
    }

    .top-actions input{
        font-size:12px;
    }

    .mobile-nav button{
        font-size:9px;
    }

    .mobile-icon{
        font-size:15px;
    }

}

/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media(max-width:900px) and (orientation:landscape){

    .mobile-nav{
        height:48px;
    }

    body{
        padding-bottom:48px;
    }

    .columns.three{
        grid-template-columns:repeat(3,1fr);
    }

    .columns{
        grid-template-columns:1fr 1fr;
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){
    *{
        scroll-behavior:auto!important;
        transition:none!important;
    }
}
</style>
</head>

function tr(key){
    return T[state.language]?.[key] || T.nl[key] || key;
}

function localized(obj){
    if(typeof obj==="string") return obj;

    return obj?.[state.language]
        || obj?.nl
        || "";
}

function subjectName(id){
    return localized(subjects[id]||{nl:id});
}

function teacherById(id){
    return teachers.find(t=>t.id===id);
}

function esc(value){
    return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatDate(date){
    return new Intl.DateTimeFormat(
        state.language==="ru"
            ?"ru-RU"
            :state.language==="en"
                ?"en-GB"
                :"nl-NL",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ).format(new Date(date+"T12:00:00"));
}

function average(){
    return (
        grades.reduce((a,b)=>a+b.grade,0)
        /grades.length
    ).toFixed(2);
}


/* ============================================================
   NAVIGATION
   ============================================================ */

function go(page){

    if(state.page!==page){

        state.history.push({
            page:state.page
        });

        state.future=[];
    }

    state.page=page;

    render();
}

function goBack(){

    if(!state.history.length){
        return;
    }

    state.future.push({
        page:state.page
    });

    state.page=state.history.pop().page;

    render();
}

function goForward(){

    if(!state.future.length){
        return;
    }

    state.history.push({
        page:state.page
    });

    state.page=state.future.pop().page;

    render();
}

function render(){

    updateNavigation();

    const pages={
        overview:renderOverview,
        schedule:renderSchedule,
        grades:renderGrades,
        homework:renderHomework,
        tests:renderTests,
        attendance:renderAttendance,
        messages:renderMessages,
        documents:renderDocuments,
        people:renderPeople,
        settings:renderSettings
    };

    const app=document.getElementById("app");

    app.innerHTML=(pages[state.page]||renderOverview)();

    document.body.classList.toggle(
        "compact",
        state.compact
    );

    const search=document.getElementById("globalSearch");

    if(search){
        search.value=state.search;
    }
}

function updateNavigation(){

    document.querySelectorAll(".nav-btn").forEach(btn=>{
        btn.classList.toggle(
            "active",
            btn.dataset.page===state.page
        );
    });

    document.querySelectorAll(".mobile-nav button").forEach(btn=>{
        btn.classList.toggle(
            "active",
            btn.dataset.page===state.page
        );
    });
}

function panel(title,content,id){

    const collapsed=!!state.collapsed[id];

    return `
        <section class="panel ${collapsed?"collapsed":""}">

            <div class="panel-title">

                <span>${esc(title)}</span>

                <div class="panel-actions">

                    <button
                        onclick="togglePanel('${id}')"
                        title="${collapsed?tr("view"):tr("close")}"
                    >
                        ${collapsed?"＋":"−"}
                    </button>

                </div>

            </div>

            <div class="panel-body">
                ${content}
            </div>

        </section>
    `;
}

function togglePanel(id){

    state.collapsed[id]=!state.collapsed[id];

    render();
}

/* ============================================================
   SEARCH
   ============================================================ */

function handleSearch(value){

    state.search=value.trim();

    if(!state.search){

        if(state.page==="search"){
            state.page="overview";
        }

        render();

        return;
    }

    renderSearch();
}

function renderSearch(){

    const q=state.search.toLowerCase();

    const results=[];

    lessons.forEach(l=>{

        const teacher=
            teacherById(l.teacher);

        const text=[
            subjectName(l.subject),
            teacher.name,
            l.room,
            localized(l.info)
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("schedule"),
                title:subjectName(l.subject),
                subtitle:
                    `${l.start}–${l.end} · ${teacher.name}`,
                action:
                    `openLesson('${l.id}')`
            });

        }

    });


    grades.forEach(g=>{

        const text=[
            subjectName(g.subject),
            localized(g.description),
            g.grade
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("grades"),
                title:
                    `${subjectName(g.subject)} — ${g.grade.toFixed(1)}`,
                subtitle:
                    localized(g.description),
                action:
                    `openGrade('${g.id}')`
            });

        }

    });


    homework.forEach(h=>{

        const text=[
            subjectName(h.subject),
            localized(h.title),
            localized(h.description)
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("homework"),
                title:localized(h.title),
                subtitle:subjectName(h.subject),
                action:
                    `openHomework('${h.id}')`
            });

        }

    });


    tests.forEach(t=>{

        const text=[
            subjectName(t.subject),
            localized(t.title),
            localized(t.material)
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("tests"),
                title:localized(t.title),
                subtitle:
                    `${subjectName(t.subject)} · ${formatDate(t.date)}`,
                action:
                    `openTest('${t.id}')`
            });

        }

    });


    messages.forEach(m=>{

        const teacher=
            teacherById(m.sender);

        const text=[
            teacher.name,
            localized(m.title),
            localized(m.body)
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("messages"),
                title:localized(m.title),
                subtitle:teacher.name,
                action:
                    `openMessage('${m.id}')`
            });

        }

    });


    teachers.forEach(t=>{

        const text=[
            t.name,
            t.email,
            subjectName(t.subject),
            localized(t.info)
        ].join(" ").toLowerCase();

        if(text.includes(q)){

            results.push({
                type:tr("people"),
                title:t.name,
                subtitle:subjectName(t.subject),
                action:
                    `openTeacher('${t.id}')`
            });

        }

    });


    document.getElementById("app").innerHTML=`

        <div class="page-head">

            <div>

                <div class="page-title">
                    ${tr("search")}
                </div>

                <div class="page-subtitle">
                    "${esc(state.search)}"
                </div>

            </div>

        </div>


        <div class="search-results">

            ${
                results.length

                ?results.map(r=>`

                    <div
                        class="result"
                        onclick="${r.action}"
                    >

                        <span class="badge blue">
                            ${esc(r.type)}
                        </span>

                        <b>
                            ${esc(r.title)}
                        </b>

                        <div class="user-sub">
                            ${esc(r.subtitle)}
                        </div>

                    </div>

                `).join("")

                :`

                    <div class="panel">

                        <div class="panel-body">
                            ${tr("noResults")}
                        </div>

                    </div>

                `
            }

        </div>

    `;
}

/* ============================================================
   MODALS
   ============================================================ */

function modal(title,body,footer=""){

    document.getElementById("modalRoot").innerHTML=`

        <div
            class="modal-bg"
            onclick="closeModal(event)"
        >

            <div
                class="modal"
                onclick="event.stopPropagation()"
            >

                <div class="modal-head">

                    <span>
                        ${esc(title)}
                    </span>

                    <button onclick="closeModal()">
                        ✕
                    </button>

                </div>

                <div class="modal-body">
                    ${body}
                </div>

                ${
                    footer
                    ?`
                        <div class="modal-foot">
                            ${footer}
                        </div>
                    `
                    :""
                }

            </div>

        </div>
    `;
}

function closeModal(event){

    if(
        event &&
        event.target!==event.currentTarget
    ){
        return;
    }

    document.getElementById(
        "modalRoot"
    ).innerHTML="";
}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape" &&
            document.getElementById("modalRoot").innerHTML
        ){
            closeModal();
        }

        if(
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase()==="k"
        ){

            event.preventDefault();

            document.getElementById(
                "globalSearch"
            )?.focus();

        }

    }
);
